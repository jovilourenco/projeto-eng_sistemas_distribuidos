spring:
  application:
    name: reserva-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reserva_db}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASSWORD:ticketflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Prazo para pagamento do ingresso e validade da trava do assento no Redis (ADR-002 e ADR-003).
reserva:
  prazo-pagamento: 9m

# 8081 já é usada pelo evento-assento-service e pelo Keycloak no docker-compose.
server:
  port: 8082