spring:
  application:
    name: reserva-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reserva_db}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASSWORD:ticketflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Explícito: as rotas de pagamento e cancelamento leem a reserva fora de transação e a alteram dentro de
    # uma transação curta (TransactionTemplate); o EntityManager da requisição mantém a mesma entidade nos dois.
    open-in-view: true
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Erros no formato ProblemDetail (RFC 7807), com a mensagem de cada ResponseStatusException no campo "detail".
  # Exceções inesperadas continuam sem detalhes para o cliente.
  mvc:
    problemdetails:
      enabled: true

  # Aceita "pix" e "aprovar" (contrato do kit de avaliação) além de "PIX" e "APROVAR".
  jackson:
    mapper:
      accept-case-insensitive-enums: true

# Prazo para pagamento da reserva e validade da trava dos assentos no Redis (ADR-002 e ADR-003).
reserva:
  prazo-pagamento: 9m

# 8081 já é usada pelo evento-assento-service e pelo Keycloak no docker-compose.
server:
  port: 8082