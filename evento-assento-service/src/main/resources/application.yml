spring:
  application:
    name: evento-assento-service
  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:evento_assento_db}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASSWORD:ticketflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # RabbitMQ (ADR-001): comandos da SAGA vindos do Serviço de Reservas
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    listener:
      simple:
        # A mensagem só é confirmada depois que o listener termina sem erro (transação local concluída).
        acknowledge-mode: auto
        # Esgotadas as tentativas, a mensagem é rejeitada sem voltar para a fila e vai para a fila de mensagens mortas.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

server:
  port: 8081