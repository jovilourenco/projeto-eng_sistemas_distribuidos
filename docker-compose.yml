version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ticketflow_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis (Para as reservas temporárias e rate limiting)
  redis:
    image: redis:7
    container_name: ticketflow_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. RabbitMQ (Broker de mensagens para o padrão SAGA e Outbox)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ticketflow_rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # Porta de comunicação dos microsserviços
      - "15672:15672" # Porta do painel de administração web (Dashboard)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: