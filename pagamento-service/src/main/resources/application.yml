spring:
  application:
    name: pagamento-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pagamento_db}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASSWORD:ticketflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082

# Configurações do Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      pagamentoService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10 # Analisa as últimas 10 requisições
        failureRateThreshold: 50.0 # Se 50% falharem, abre o circuito
        slowCallRateThreshold: 50.0
        slowCallDurationThreshold: 3s # Considera lenta se demorar mais de 3 segundos
        waitDurationInOpenState: 10s # Fica aberto por 10 segundos antes de testar de novo
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true